name: Picks reminders

on:
  schedule:
    # GitHub Actions provides the frequent scheduler unavailable on Vercel Hobby.
    - cron: '*/5 * * * *'
  workflow_dispatch:

concurrency:
  group: picks-reminders
  cancel-in-progress: false

jobs:
  remind:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check for upcoming missing picks
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          curl --fail-with-body --silent --show-error \
            --retry 2 \
            --header "Authorization: Bearer ${CRON_SECRET}" \
            https://4man.vercel.app/api/cron/picks/reminders
